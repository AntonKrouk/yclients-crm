<!doctype html>
<html lang="ru" data-look="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2522">
<title>Privé7 Мастера</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<!--app-->
<header class="top">
  <button class="back" id="back" type="button" aria-label="Назад" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <div class="mark" role="img" aria-label="Privé7"></div>
  <div class="salons" id="salons" role="tablist" aria-label="Салон"></div>
</header>
<p class="demo-note" id="demoNote" hidden>Демонстрация: мастера, работы, цены и телефоны примерные, отзывы никуда не уходят.<span class="look-sw" id="lookSw" role="group" aria-label="Оформление"></span></p>
<main id="app" aria-live="polite"></main>
<footer class="foot"><a href="/privacy">Политика обработки персональных данных</a></footer>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="bar-sum" id="barSum"></div>
    <button class="btn" id="barBtn" type="button"></button>
  </div>
</div>
<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lbClose" type="button" aria-label="Закрыть">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Предыдущая работа">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <figure class="lb-fig"><div class="lb-img" id="lbImg"></div>
    <figcaption><span id="lbCap"></span><span class="lb-count" id="lbCount"></span></figcaption></figure>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Следующая работа">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h"><h2 id="sheetTitle">Позвонить в салон</h2>
      <button class="lb-x sheet-x" id="sheetClose" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6"/></svg>
      </button></div>
    <p class="sheet-sub">Администратор подберёт время и мастера.</p>
    <div id="sheetList"></div>
  </div>
</div>
<!--/app-->
<script src="/portal.js"></script>
</body>
</html>
