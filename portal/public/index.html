<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F0">
<title>Privé7 Запись</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<!--app-->
<header class="top">
  <button class="back" id="back" type="button" aria-label="Назад" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <div class="mark">PRIVÉ<span>7</span></div>
  <div class="salons" id="salons" role="tablist" aria-label="Салон"></div>
</header>
<p class="demo-note" id="demoNote" hidden>Демонстрация: мастера, работы и цены примерные, запись никуда не уходит.</p>
<main id="app" aria-live="polite"></main>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="bar-sum" id="barSum"></div>
    <button class="btn" id="barBtn" type="button"></button>
  </div>
</div>
<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lbClose" type="button" aria-label="Закрыть">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <figure class="lb-fig"><div class="lb-img" id="lbImg"></div><figcaption id="lbCap"></figcaption></figure>
</div>
<!--/app-->
<script src="/portal.js"></script>
</body>
</html>
