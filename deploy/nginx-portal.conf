# Витрина для клиентов (portal/server.js, порт 3021) — masters.prive7crm.ru.
# Поддомен заведён в Timeweb 04.10.2026, A-запись прямо на 194.187.122.175.
# Установка: cp в /etc/nginx/sites-available/yclients-portal, ln -s в sites-enabled,
# nginx -t && systemctl reload nginx, затем certbot --nginx -d masters.prive7crm.ru
# (certbot сам допишет HTTPS и редирект с http).

server {
    listen 80;
    listen [::]:80;
    server_name masters.prive7crm.ru;

    client_max_body_size 32k;       # в портал ходят только маленькие JSON (отзывы)

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
